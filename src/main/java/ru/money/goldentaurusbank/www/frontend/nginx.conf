server {
    listen 80;
    server_name _;

    # Разрешаем крупные тела запросов — в приложении есть импорт Excel
    client_max_body_size 25m;

    root /usr/share/nginx/html;
    index index.html;

    # API проксируем на бэкенд-контейнер (имя сервиса в docker-compose = app)
    location /api/ {
        proxy_pass http://app:8081;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # На случай долгих операций (импорт/экспорт)
        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
    }

    # SPA-fallback: любой неизвестный путь отдаём index.html (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
