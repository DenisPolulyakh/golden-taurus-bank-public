# Имя проекта фиксируем явно. Значение обязано совпадать с прежним (оно бралось
# из имени каталога), иначе compose начнёт искать тома goldentaurus_postgres_data
# вместо существующих golden-taurus-bank_postgres_data — то есть с пустой БД.
name: golden-taurus-bank

services:
  postgres:
    image: postgres:16-alpine
    container_name: golden_taurus_db
    environment:
      POSTGRES_DB: taurus_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3245:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    # Тег на каждую выкладку: APP_TAG=$GITHUB_SHA docker compose up -d --build,
    # откат — APP_TAG=<прежний sha> docker compose up -d (образ уже собран)
    image: goldentaurus/app:${APP_TAG:-latest}
    container_name: golden_taurus_app
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/taurus_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: ${DB_SCHEMA:-taurus}
      JWT_SECRET: ${JWT_SECRET}
      # Шифрование номеров карт. Без них приложение не поднимется —
      # завести в .env до выкладки (salt: openssl rand -hex 8)
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8081
      FRONTEND_URL: ${FRONTEND_URL}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Почта (необязательно — оставьте пустым, если не нужна)
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # Продовые логи потише
      JPA_SHOW_SQL: "false"
      LOG_LEVEL_SQL: INFO
      LOG_LEVEL_LIQUIBASE: INFO
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # curl есть в eclipse-temurin:21-jre, отдельно ставить не нужно
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      # Старт Spring + миграции Liquibase: до этого провалы не считаются
      start_period: 90s
    restart: unless-stopped
    # Порт 8081 наружу не публикуем — доступ только через Caddy

  web:
    build: ./src/main/java/ru/money/goldentaurusbank/www/frontend
    image: goldentaurus/web:${APP_TAG:-latest}
    container_name: golden_taurus_web
    environment:
      # TLS терминирует системный Caddy, внутренний слушает голый HTTP
      APP_DOMAIN: ":80"
    ports:
      # Наружу не светим: только системный Caddy ходит на 127.0.0.1:8080
      - "127.0.0.1:8080:80"
    volumes:
      - caddy_data:/data
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
