services:
  postgres:
    image: postgres:16-alpine
    container_name: golden_taurus_db
    environment:
      POSTGRES_DB: taurus_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3245:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    container_name: golden_taurus_app
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/taurus_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: ${DB_SCHEMA:-taurus}
      JWT_SECRET: ${JWT_SECRET}
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8081
      FRONTEND_URL: ${FRONTEND_URL}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Почта (необязательно — оставьте пустым, если не нужна)
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # Продовые логи потише
      JPA_SHOW_SQL: "false"
      LOG_LEVEL_SQL: INFO
      LOG_LEVEL_LIQUIBASE: INFO
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # Порт 8081 наружу не публикуем — доступ только через nginx

  nginx:
    build: ./src/main/java/ru/money/goldentaurusbank/www/frontend
    container_name: golden_taurus_nginx
    ports:
      - "${APP_HTTP_PORT:-80}:80"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres_data:
