name: CI

# Тесты и сборка идут на раннерах GitHub, не на VPS: на 2 vCPU и 3.7 ГБ
# компиляция рядом с боевой БД упирается в память (см. plans/planCICD.md, п. 12).
on:
  push:
    branches: [main]      # прямые пуши в main + слияния PR
  pull_request:           # всё остальное проверяется через PR
  workflow_dispatch:      # кнопка «Run workflow» — прогнать ветку без PR

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # stdout/stderr обязательны: с Java 19 одного file.encoding мало,
      # иначе @DisplayName на русском выводится вопросами
      MAVEN_OPTS: -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8
      FRONTEND_DIR: src/main/java/ru/money/goldentaurusbank/www/frontend

    steps:
      - uses: actions/checkout@v7
        with:
          # Иначе раннер сложит свой токен в .git/config открытым текстом
          persist-credentials: false

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Бэкенд — тесты (Testcontainers сам поднимет и удалит postgres)
        run: ./mvnw -B -ntp verify

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/main/java/ru/money/goldentaurusbank/www/frontend/package-lock.json

      - name: Фронт — зависимости
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci --no-audit --no-fund

      # Пока не блокирует: в коде 52 ошибки eslint (react-hooks/*, no-unused-vars).
      # Когда разгребём — убрать continue-on-error, и линтер станет гейтом.
      - name: Фронт — линтер (пока не блокирует)
        continue-on-error: true
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run lint

      # Артефакт CI больше не выкладывает: его никто не забирал. Выкладка собирает
      # себе jar и dist сама и в том же прогоне их и распаковывает (deploy.yml,
      # job `build` → `deploy-<sha>`). Лишняя копия только ела 500 МБ квоты на Free
      # и в итоге роняла зелёный прогон на `Artifact storage quota has been hit`.
      - name: Фронт — сборка
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run build
